<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>成人学園 — 表紙とメニュー</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="comparison">
    <main class="comparisonShell">
      <header class="comparisonHeader">
        <a href="../">← 一覧</a>
        <h1>成人学園 <span>校章主役・表紙の開閉</span></h1>
      </header>
      <fieldset class="accentPicker">
        <legend>エンブレム</legend>
        <label
          ><input type="radio" name="accent" value="champagne" checked /><span
            ><i class="swatch champagne" aria-hidden="true"></i>シャンパン</span
          ></label
        >
        <label
          ><input type="radio" name="accent" value="mint" /><span
            ><i class="swatch mint" aria-hidden="true"></i>アイスミント</span
          ></label
        >
        <label
          ><input type="radio" name="accent" value="lilac" /><span
            ><i class="swatch lilac" aria-hidden="true"></i>ライラック</span
          ></label
        >
      </fieldset>
      <div class="previewTools">
        <label
          >描画幅
          <select id="width">
            <option value="390">スマホ · 390px</option>
            <option value="768">タブレット · 768px</option>
            <option value="1440">PC · 1440px</option>
          </select></label
        >
        <label><input type="checkbox" id="fit" checked /> 縮小表示</label>
        <div class="motionControls">
          <button type="button" data-book="open">開く</button
          ><button type="button" data-book="closed">閉じる</button>
        </div>
      </div>
      <div class="previewArea" id="area">
        <div class="previewSizer" id="sizer">
          <iframe
            id="screen"
            title="成人学園のメニュープレビュー"
            src="./screen.html?accent=champagne"
          ></iframe>
        </div>
      </div>
      <details class="references">
        <summary>参考デザイン</summary>
        <div class="referenceLinks">
          <a
            id="physicalRef"
            href="https://www.hightide.co.jp/feature/penco/"
            target="_blank"
            rel="noreferrer"
            >penco ↗</a
          >
          <a
            id="graphicRef"
            href="https://www.danganronpa.com/reload/about/"
            target="_blank"
            rel="noreferrer"
            >ダンガンロンパ 1・2 Reload ↗</a
          >
        </div>
      </details>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const accents = ["champagne", "mint", "lilac"];
      let accent = accents.includes(params.get("accent"))
        ? params.get("accent")
        : "champagne";
      const frame = document.getElementById("screen");
      const width = document.getElementById("width");
      const fit = document.getElementById("fit");
      const area = document.getElementById("area");
      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.delete("concept");
        url.searchParams.set("accent", accent);
        history.replaceState(null, "", url);
      }
      function resize() {
        const w = Number(width.value);
        const scale = fit.checked ? Math.min(1, area.clientWidth / w) : 1;
        frame.style.width = `${w}px`;
        frame.style.height = "760px";
        frame.style.transform = `scale(${scale})`;
        document.getElementById("sizer").style.width = `${w * scale}px`;
        document.getElementById("sizer").style.height = `${760 * scale}px`;
      }
      document.querySelector(`input[name=accent][value=${accent}]`).checked =
        true;
      frame.src = `./screen.html?accent=${accent}`;
      document.querySelectorAll("input[name=accent]").forEach((input) =>
        input.addEventListener("change", () => {
          accent = input.value;
          updateUrl();
          frame.contentWindow.postMessage(
            { type: "accent", value: accent },
            location.origin,
          );
        }),
      );
      document
        .querySelectorAll("[data-book]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            frame.contentWindow.postMessage(
              { type: "book", value: button.dataset.book },
              location.origin,
            ),
          ),
        );
      frame.addEventListener("load", () =>
        frame.contentWindow.postMessage(
          { type: "accent", value: accent },
          location.origin,
        ),
      );
      width.addEventListener("change", resize);
      fit.addEventListener("change", resize);
      new ResizeObserver(resize).observe(area);
      resize();
    </script>
  </body>
</html>
