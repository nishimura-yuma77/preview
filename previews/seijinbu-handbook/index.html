<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>成人学園 — メニューデザイン3案</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="comparison">
    <main class="comparisonShell">
      <header class="comparisonHeader">
        <a href="../">← 一覧</a>
        <h1>成人学園 <span>メニューデザイン3案</span></h1>
      </header>
      <fieldset class="conceptPicker">
        <legend>デザイン</legend>
        <label
          ><input type="radio" name="concept" value="emblem" /><span
            ><b>01</b> 校章主役</span
          ></label
        >
        <label
          ><input type="radio" name="concept" value="vertical" checked /><span
            ><b>02</b> 静かな縦組み</span
          ></label
        >
        <label
          ><input type="radio" name="concept" value="space" /><span
            ><b>03</b> 余白の手帳</span
          ></label
        >
      </fieldset>
      <fieldset class="accentPicker">
        <legend>エンブレム</legend>
        <label
          ><input type="radio" name="accent" value="champagne" checked /><span
            ><i class="swatch champagne" aria-hidden="true"></i>シャンパン</span
          ></label
        >
        <label
          ><input type="radio" name="accent" value="mint" /><span
            ><i class="swatch mint" aria-hidden="true"></i>アイスミント</span
          ></label
        >
        <label
          ><input type="radio" name="accent" value="lilac" /><span
            ><i class="swatch lilac" aria-hidden="true"></i>ライラック</span
          ></label
        >
      </fieldset>
      <div class="previewTools">
        <label
          >描画幅
          <select id="width">
            <option value="390">スマホ · 390px</option>
            <option value="768">タブレット · 768px</option>
            <option value="1440">PC · 1440px</option>
          </select></label
        >
        <label><input type="checkbox" id="fit" checked /> 縮小表示</label>
        <label
          >状態
          <select id="account">
            <option value="guest">未ログイン</option>
            <option value="member">ログイン済み</option>
          </select></label
        >
      </div>
      <div class="previewArea" id="area">
        <div class="previewSizer" id="sizer">
          <iframe
            id="screen"
            title="成人学園のメニュープレビュー"
            src="./screen.html?concept=vertical&accent=champagne"
          ></iframe>
        </div>
      </div>
      <details class="references">
        <summary>参考デザイン</summary>
        <div class="referenceLinks">
          <a
            id="physicalRef"
            href="https://www.hightide.co.jp/feature/penco/"
            target="_blank"
            rel="noreferrer"
            >penco ↗</a
          >
          <a
            id="graphicRef"
            href="https://www.danganronpa.com/reload/about/"
            target="_blank"
            rel="noreferrer"
            >ダンガンロンパ 1・2 Reload ↗</a
          >
        </div>
      </details>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const concepts = ["emblem", "vertical", "space"];
      const accents = ["champagne", "mint", "lilac"];
      const legacyConcepts = {
        crest: "emblem",
        collage: "space",
        dossier: "vertical",
      };
      const requestedConcept =
        legacyConcepts[params.get("concept")] || params.get("concept");
      let concept = concepts.includes(requestedConcept)
        ? requestedConcept
        : "vertical";
      let accent = accents.includes(params.get("accent"))
        ? params.get("accent")
        : "champagne";
      const frame = document.getElementById("screen");
      const width = document.getElementById("width");
      const fit = document.getElementById("fit");
      const area = document.getElementById("area");
      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("concept", concept);
        url.searchParams.set("accent", accent);
        history.replaceState(null, "", url);
      }
      function resize() {
        const w = Number(width.value);
        const scale = fit.checked ? Math.min(1, area.clientWidth / w) : 1;
        frame.style.width = `${w}px`;
        frame.style.height = "760px";
        frame.style.transform = `scale(${scale})`;
        document.getElementById("sizer").style.width = `${w * scale}px`;
        document.getElementById("sizer").style.height = `${760 * scale}px`;
      }
      document.querySelector(`input[name=concept][value=${concept}]`).checked =
        true;
      document.querySelector(`input[name=accent][value=${accent}]`).checked =
        true;
      frame.src = `./screen.html?concept=${concept}&accent=${accent}`;
      document.querySelectorAll("input[name=concept]").forEach((input) =>
        input.addEventListener("change", () => {
          concept = input.value;
          updateUrl();
          frame.contentWindow.postMessage(
            { type: "concept", value: concept },
            location.origin,
          );
        }),
      );
      document.querySelectorAll("input[name=accent]").forEach((input) =>
        input.addEventListener("change", () => {
          accent = input.value;
          updateUrl();
          frame.contentWindow.postMessage(
            { type: "accent", value: accent },
            location.origin,
          );
        }),
      );
      document
        .getElementById("account")
        .addEventListener("change", (event) =>
          frame.contentWindow.postMessage(
            { type: "account", value: event.target.value },
            location.origin,
          ),
        );
      window.addEventListener("message", (event) => {
        if (
          event.origin === location.origin &&
          event.source === frame.contentWindow &&
          event.data.type === "account"
        )
          document.getElementById("account").value = event.data.value;
      });
      width.addEventListener("change", resize);
      fit.addEventListener("change", resize);
      new ResizeObserver(resize).observe(area);
      resize();
    </script>
  </body>
</html>
