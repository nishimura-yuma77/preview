<!doctype html>
<html lang="ja" data-theme="neo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seijinbu：Art Deco寄りの3テーマ</title>
  <link rel="stylesheet" href="./style.css?v=deco-2">
</head>
<body class="viewer">
  <main class="comparison">
    <header class="comparison-heading">
      <h1>Seijinbu：Art Deco比較</h1>
      <a id="reference" href="https://www.architecturaldigest.com/story/neo-deco-decor" target="_blank" rel="noopener noreferrer">テーマ紹介サイト ↗</a>
    </header>
    <fieldset class="themes">
      <legend id="theme-name">テーマ：Neo Deco</legend>
      <label title="Neo Deco"><input type="radio" name="theme" value="neo" aria-label="Neo Deco（ネオ・デコ）" checked><span>ネオ・デコ</span></label>
      <label title="Streamline Moderne"><input type="radio" name="theme" value="streamline" aria-label="Streamline Moderne（流線形デコ）"><span>流線形デコ</span></label>
      <label title="Vienna Secession"><input type="radio" name="theme" value="secession" aria-label="Vienna Secession（ウィーン分離派）"><span>ウィーン<br>分離派</span></label>
    </fieldset>
    <dl class="palette">
      <div><dt>背景</dt><dd><i data-color="base" aria-hidden="true"></i><code id="base-code">#071B17</code></dd></div>
      <div><dt>モーダル</dt><dd><i data-color="surface" aria-hidden="true"></i><code id="surface-code">#00523E</code></dd></div>
      <div><dt>モーダル文字</dt><dd><i data-color="ink" aria-hidden="true"></i><code id="ink-code">#FFFDF5</code></dd></div>
      <div><dt>主操作</dt><dd><i data-color="action" aria-hidden="true"></i><code id="action-code">#E8C977</code></dd></div>
      <div><dt>装飾</dt><dd><i data-color="accent" aria-hidden="true"></i><code id="accent-code">#E8C977</code></dd></div>
    </dl>
    <div class="view-controls">
      <fieldset class="states">
        <legend>画面</legend>
        <label><input type="radio" name="state" value="lp"><span>LP</span></label>
        <label><input type="radio" name="state" value="menu"><span>メニュー</span></label>
        <label><input type="radio" name="state" value="register" checked><span>登録</span></label>
        <label><input type="radio" name="state" value="login"><span>ログイン</span></label>
        <label><input type="radio" name="state" value="pending"><span>本人確認待ち</span></label>
        <label><input type="radio" name="state" value="reset"><span>再設定</span></label>
      </fieldset>
      <div class="sizes">
        <label for="width">表示幅</label>
        <select id="width"><option value="390">スマホ 390px</option><option value="768">タブレット 768px</option><option value="1440">PC 1440px</option></select>
        <label class="fit-control"><input id="actual-size" type="checkbox">等倍</label>
      </div>
    </div>
    <div id="viewport" class="viewport">
      <div id="footprint"><iframe id="screen" title="Seijinbu テーマプレビュー" src="./screen.html?v=deco-2&amp;theme=neo&amp;state=register"></iframe></div>
    </div>
  </main>
  <script>
    const palettes = {
      neo: { name: 'Neo Deco', colors: ['#071B17', '#00523E', '#FFFDF5', '#E8C977', '#E8C977'], reference: 'https://www.architecturaldigest.com/story/neo-deco-decor' },
      streamline: { name: 'Streamline Moderne', colors: ['#09262B', '#FFFFFF', '#102C32', '#005C6B', '#B8CDD4'], reference: 'https://www.sfomuseum.org/exhibitions/streamlines-air-age-aesthetics-industrial-design' },
      secession: { name: 'Vienna Secession', colors: ['#0B1D15', '#FFFDF5', '#17281F', '#07543D', '#D8B45B'], reference: 'https://www.theartstory.org/movement/vienna-secession/' },
    }
    const modes = ['lp', 'menu', 'register', 'login', 'pending', 'reset']
    const params = new URLSearchParams(location.search)
    let theme = Object.hasOwn(palettes, params.get('theme')) ? params.get('theme') : 'neo'
    let state = modes.includes(params.get('state')) ? params.get('state') : 'register'
    const defaultWidth = innerWidth < 820 ? 390 : 1440
    let width = [390, 768, 1440].includes(Number(params.get('width'))) ? Number(params.get('width')) : defaultWidth
    const frame = document.getElementById('screen')
    const viewport = document.getElementById('viewport')
    const footprint = document.getElementById('footprint')
    const widthSelect = document.getElementById('width')
    let pendingFocus = null
    widthSelect.value = String(width)

    function saveLocation() {
      history.replaceState(null, '', `?theme=${theme}&state=${state}&width=${width}`)
    }
    function markSelection(name, value) {
      document.querySelectorAll(`input[name="${name}"]`).forEach(input => { input.checked = input.value === value })
    }
    function setTheme(value, send = true) {
      theme = value
      document.documentElement.dataset.theme = theme
      markSelection('theme', theme)
      document.getElementById('theme-name').textContent = `テーマ：${palettes[theme].name}`
      ;['base', 'surface', 'ink', 'action', 'accent'].forEach((role, index) => { document.getElementById(`${role}-code`).textContent = palettes[theme].colors[index] })
      document.getElementById('reference').href = palettes[theme].reference
      if (send) frame.contentWindow.postMessage({ type: 'theme', value: theme }, location.origin)
      saveLocation()
    }
    function setState(value, send = true) {
      state = value
      markSelection('state', state)
      if (send) frame.contentWindow.postMessage({ type: 'state', value: state }, location.origin)
      saveLocation()
    }
    function resize() {
      width = Number(widthSelect.value)
      const scale = document.getElementById('actual-size').checked ? 1 : Math.min(1, viewport.clientWidth / width)
      frame.style.width = `${width}px`
      frame.style.height = '800px'
      frame.style.transform = `scale(${scale})`
      footprint.style.width = `${width * scale}px`
      footprint.style.height = `${800 * scale}px`
      saveLocation()
    }
    document.querySelectorAll('input[name="theme"]').forEach(input => input.addEventListener('change', () => setTheme(input.value)))
    document.querySelectorAll('input[name="state"]').forEach(input => input.addEventListener('change', () => { pendingFocus = input; setState(input.value) }))
    widthSelect.addEventListener('change', resize)
    document.getElementById('actual-size').addEventListener('change', resize)
    new ResizeObserver(resize).observe(viewport)
    frame.addEventListener('load', () => { setTheme(theme); setState(state); resize() })
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== frame.contentWindow) return
      if (event.data?.type === 'state' && modes.includes(event.data.value)) setState(event.data.value, false)
      if (event.data?.type === 'state-ready' && event.data.value === state && pendingFocus) { pendingFocus.focus({ preventScroll: true }); pendingFocus = null }
    })
    setTheme(theme, false)
    setState(state, false)
    resize()
  </script>
</body>
</html>
