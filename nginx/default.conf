server {
    listen 80;
    listen [::]:80;
    server_name jkdv1.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://jkdv1.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jkdv1.net;

    ssl_certificate /etc/letsencrypt/live/jkdv1.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkdv1.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
