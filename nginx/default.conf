server {
    listen 80;
    listen [::]:80;
    server_name jkdv1.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://jkdv1.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jkdv1.net;

    ssl_certificate /etc/letsencrypt/live/jkdv1.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkdv1.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location = /task {
        auth_basic "Reply watch";
        auth_basic_user_file /etc/nginx/reply-watch.htpasswd;
        alias /usr/share/nginx/reply-watch/index.html;
        default_type text/html;
        add_header Cache-Control no-store always;
    }

    location = /task/api/pending {
        auth_basic "Reply watch";
        auth_basic_user_file /etc/nginx/reply-watch.htpasswd;
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8787/task/api/pending;
    }

    location ^~ /task/ {
        auth_basic "Reply watch";
        auth_basic_user_file /etc/nginx/reply-watch.htpasswd;
        alias /usr/share/nginx/reply-watch/;
        add_header Cache-Control no-store always;
    }

    location ^~ /internal/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
